<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="36" viewBox="0 0 1200 36" role="img">

<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
    <stop offset="0.25" stop-color="#a855f7" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#22d3ee" stop-opacity="1"/>
    <stop offset="0.75" stop-color="#c026d3" stop-opacity="0.9"/>
