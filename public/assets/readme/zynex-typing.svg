<svg xmlns="http://www.w3.org/2000/svg" width="900" height="100" viewBox="0 0 900 100" role="img">
<defs>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.5" stop-color="#c4b5fd"/>
    <stop offset="1" stop-color="#f0abfc"/>
  </linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="6" result="b"/>
