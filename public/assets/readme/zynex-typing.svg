    <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#e9d5ff" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
  </linearGradient>
</defs>
<text x="450" y="50" text-anchor="middle" textLength="360" lengthAdjust="spacingAndGlyphs"
