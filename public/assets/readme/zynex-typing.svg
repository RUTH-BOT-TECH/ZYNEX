      fill="url(#txt)" filter="url(#g)">ZYNEX-MD</text>
<rect x="638" y="18" width="7" height="36" fill="#e9d5ff">
  <animate attributeName="opacity" values="1;1;0;0;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
<text x="450" y="82" text-anchor="middle" font-family="Verdana,DejaVu Sans,Arial,sans-serif"
      font-size="14" fill="#a78bfa" letter-spacing="2">WHATSAPP BOT  /  PAIR ONCE  /  DEPLOY ANYWHERE  /  NEVER BLUFF</text>
<rect x="270" y="92" width="360" height="2" fill="url(#scan)">
  <animate attributeName="x" values="270;540;270" dur="6s" repeatCount="indefinite"/>
</rect>
</svg>
